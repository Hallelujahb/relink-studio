name: Bug report
description: Something broke or behaved unexpectedly
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: And what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Load the files...\n2. Run with methods A and B...\n3. See the error"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      description: The last lines of `relink.log` are usually enough.
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python version, Node version, browser
      placeholder: "Ubuntu 24.04, Python 3.12, Node 20, Firefox"
